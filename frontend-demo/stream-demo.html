<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 8px 16px;
      cursor: pointer;
    }

    #answer {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ddd;
      min-height: 120px;
      white-space: pre-wrap;
    }

    /* thinking 事件：灰色提示，收到首个 message 后隐藏 */
    #thinking {
      margin-top: 24px;
      color: #9aa0a6;
      font-size: 13px;
      animation: thinking-pulse 1.2s ease-in-out infinite;
    }

    #thinking[hidden] {
      display: none;
    }

    @keyframes thinking-pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.55;
      }
    }
  </style>
  <body>
    <h1>AI Chat Stream Demo</h1>

    <textarea id="question">请用三句话解释什么是 Streaming 流式输出。</textarea>
    <br />
    <button onclick="sendMessage()">发送</button>

    <div id="thinking" hidden>正在理解你的问题...</div>
    <div id="answer"></div>
    <script>
      async function sendMessage() {
        const question = document.getElementById("question").value;
        const answerEl = document.getElementById("answer");
        const thinkingEl = document.getElementById("thinking");

        answerEl.textContent = "";
        thinkingEl.hidden = true;

        const response = await fetch("http://127.0.0.1:8000/api/v1/chat/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": "dev-api-key-123",
            "x-user-id": "u_10001",
            "x-username": "dawei",
          },
          body: JSON.stringify({
            messages: [
              {
                role: "user",
                content: question,
              },
            ],
            model: "glm-5.3-flash",
            temperature: 0.7,
            stream: true,
          }),
        });

        if (!response.ok) {
          answerEl.textContent = `请求失败Error: ${response.status} ${response.statusText}`;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();

          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const rawEvent of events) {
            handleSSEEvent(rawEvent, answerEl, thinkingEl);
          }
        }
      }

      function handleSSEEvent(rawEvent, answerEl, thinkingEl) {
        const lines = rawEvent.split("\n");

        let eventName = "message";
        let dataText = "";

        for (const line of lines) {
          if (line.startsWith("event: ")) {
            eventName = line.replace("event: ", "").trim();
          }

          if (line.startsWith("data: ")) {
            dataText = line.replace("data: ", "").trim();
          }
        }

        if (!dataText) {
          return;
        }

        const data = JSON.parse(dataText);

        if (eventName === "thinking") {
          // 模型还在理解问题，先给个灰色提示
          thinkingEl.textContent = data.content || "正在理解你的问题...";
          thinkingEl.hidden = false;
        }

        if (eventName === "message") {
          // 正文第一个字符到了，说明已经开始输出，收起思考提示
          thinkingEl.hidden = true;
          answerEl.textContent += data.content || "";
        }

        if (eventName === "done") {
          thinkingEl.hidden = true;
          console.log("done:", data);
        }

        if (eventName === "error") {
          thinkingEl.hidden = true;
          answerEl.textContent += `\n\nError: ${data.message}`;
        }
      }
    </script>
  </body>
</html>
